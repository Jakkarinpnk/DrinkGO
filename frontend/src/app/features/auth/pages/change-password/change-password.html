<main class="auth-container">
  <section class="auth-card">
    <header class="auth-header">
      <h2>เปลี่ยนรหัสผ่าน</h2>
      <p>หลังเปลี่ยนรหัสผ่าน ระบบจะให้ออกจากระบบทุกอุปกรณ์</p>
    </header>

    <div class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="current-password">รหัสผ่านปัจจุบัน</label>
        <input id="current-password" type="password" formControlName="currentPassword" autocomplete="current-password">
        <span class="error-text" *ngIf="form.controls.currentPassword.touched && form.controls.currentPassword.invalid">
          กรุณากรอกรหัสผ่านปัจจุบัน
        </span>
      </div>

      <div class="form-group">
        <label for="change-new-password">รหัสผ่านใหม่</label>
        <input id="change-new-password" type="password" formControlName="newPassword" autocomplete="new-password">
        <span class="error-text" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid">
          รหัสผ่านต้องมีความยาว 8-72 ตัวอักษร
        </span>
      </div>

      <div class="form-group">
        <label for="change-confirm-password">ยืนยันรหัสผ่านใหม่</label>
        <input id="change-confirm-password" type="password" formControlName="confirmPassword" autocomplete="new-password">
        <span class="error-text" *ngIf="form.controls.confirmPassword.touched && form.hasError('passwordMismatch')">
          รหัสผ่านไม่ตรงกัน
        </span>
      </div>

      <button class="btn-primary" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'กำลังเปลี่ยนรหัสผ่าน...' : 'เปลี่ยนรหัสผ่าน' }}
      </button>
    </form>

    <p class="auth-link"><a routerLink="/">ยกเลิกและกลับหน้าหลัก</a></p>
  </section>
</main>
