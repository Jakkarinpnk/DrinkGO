<main class="auth-container">
  <section class="auth-card forgot-card">
    <header class="auth-header">
      <h2>ลืมรหัสผ่าน</h2>
      <p>ยืนยันอีเมลและรหัส OTP ก่อนตั้งรหัสผ่านใหม่</p>
    </header>

    <div class="alert-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="emailForm" (ngSubmit)="sendOtp()">
      <div class="form-group">
        <label for="forgot-email">อีเมล</label>
        <div class="email-row">
          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="example@email.com">
          <button *ngIf="otpSent" type="button" class="text-button" (click)="changeEmail()">
            เปลี่ยนอีเมล
          </button>
        </div>
        <span class="error-text" *ngIf="emailForm.controls.email.touched && emailForm.controls.email.invalid">
          กรุณากรอกอีเมลให้ถูกต้อง
        </span>
      </div>

      <button class="btn-primary" type="submit" [disabled]="isSending || otpSent">
        {{ isSending ? 'กำลังส่ง OTP...' : (otpSent ? 'ส่ง OTP แล้ว' : 'ส่งรหัส OTP') }}
      </button>
    </form>

    <section *ngIf="otpSent" class="otp-section">
      <label>รหัส OTP</label>
      <p>กรอกรหัสตัวเลข 6 หลักที่ส่งไปยังอีเมล</p>

      <div class="otp-inputs">
        <input
          *ngFor="let digit of otpDigits; index as index; trackBy: trackDigit"
          type="text"
          inputmode="numeric"
          maxlength="1"
          [value]="digit"
          [attr.aria-label]="'OTP หลักที่ ' + (index + 1)"
          [attr.autocomplete]="index === 0 ? 'one-time-code' : 'off'"
          (input)="onOtpInput($event, index)"
          (keydown)="onOtpKeydown($event, index)"
          (paste)="onOtpPaste($event)">
      </div>

      <button type="button" class="verify-button" [disabled]="isVerifying" (click)="verifyOtp()">
        {{ isVerifying ? 'กำลังตรวจสอบ...' : 'ยืนยัน OTP' }}
      </button>
      <button type="button" class="resend-button" [disabled]="isSending" (click)="sendOtp()">
        ส่ง OTP อีกครั้ง
      </button>
    </section>

    <p class="auth-link"><a routerLink="/auth/login">กลับไปหน้าเข้าสู่ระบบ</a></p>
  </section>
</main>
