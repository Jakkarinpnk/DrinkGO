<main class="auth-container">
  <section class="auth-card">
    <header class="auth-header">
      <h2>ตั้งรหัสผ่านใหม่</h2>
      <p>OTP ได้รับการยืนยันแล้ว กรุณากำหนดรหัสผ่านใหม่</p>
    </header>

    <div class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group" *ngIf="email">
        <label>อีเมล</label>
        <input type="email" [value]="email" disabled>
      </div>

      <div class="form-group">
        <label for="new-password">รหัสผ่านใหม่</label>
        <input id="new-password" type="password" formControlName="newPassword" autocomplete="new-password">
        <span class="error-text" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid">
          รหัสผ่านต้องมีความยาว 8-72 ตัวอักษร
        </span>
      </div>

      <div class="form-group">
        <label for="confirm-reset-password">ยืนยันรหัสผ่านใหม่</label>
        <input id="confirm-reset-password" type="password" formControlName="confirmPassword" autocomplete="new-password">
        <span class="error-text" *ngIf="form.controls.confirmPassword.touched && form.hasError('passwordMismatch')">
          รหัสผ่านไม่ตรงกัน
        </span>
      </div>

      <button class="btn-primary" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'กำลังบันทึก...' : 'ตั้งรหัสผ่านใหม่' }}
      </button>
    </form>

    <p class="auth-link"><a routerLink="/auth/forgot-password">กลับไปยืนยัน OTP ใหม่</a></p>
  </section>
</main>
