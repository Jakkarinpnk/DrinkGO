<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>เข้าสู่ระบบ</h2>
            <p>จองโต๊ะร้านเครื่องดื่มและบาร์สุดโปรดของคุณ</p>
        </div>

        <div class="alert-error" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>

        <div class="alert-info" *ngIf="infoMessage">
            {{ infoMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" formControlName="email" placeholder="กรอกอีเมล">
                <span class="error-text"
                    *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">กรุณากรอกอีเมล</span>
                <span class="error-text"
                    *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">รูปแบบอีเมลไม่ถูกต้อง</span>
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" formControlName="password" placeholder="••••••••">
                <span class="error-text"
                    *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">กรุณากรอกรหัสผ่าน</span>
            </div>

            <button type="submit" class="btn-primary" [disabled]="isLoading">
                {{ isLoading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ' }}
            </button>

            <a routerLink="/auth/forgot-password" class="forgot-password-link">ลืมรหัสผ่าน?</a>

        </form>

        <div class="divider">
            <span>หรือเข้าสู่ระบบด้วย</span>
        </div>

        <!-- Google Sign-In Button -->
        <div class="google-btn-wrapper">
            <app-google-sign-in-button
                (success)="handleGoogleSuccess($event)"
                (error)="handleGoogleError($event)">
            </app-google-sign-in-button>
        </div>

        <div class="register-link">
            ยังไม่มีบัญชีใช่ไหม? <a routerLink="/auth/register">สมัครสมาชิกเลย</a>
        </div>
    </div>
</div>
