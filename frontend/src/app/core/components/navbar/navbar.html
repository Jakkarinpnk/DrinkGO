<nav class="navbar">
    <div class="nav-container">
        <a routerLink="/" class="nav-logo">DrinkGo</a>

        <ul class="nav-menu">
            <li *ngIf="isLoggedIn && currentUser?.role === 'owner'">
                <a routerLink="/owner" class="badge-owner">จัดการร้านค้า</a>
            </li>
        </ul>

        <div class="nav-auth">
            <ng-container *ngIf="!isLoggedIn">
                <a routerLink="/auth/login" class="btn-login">เข้าสู่ระบบ</a>
                <a routerLink="/auth/register" class="btn-register">สมัครสมาชิก</a>
            </ng-container>

            <ng-container *ngIf="isLoggedIn">
                <span class="user-name">สวัสดี, {{ currentUser?.fullName }}</span>
                <button (click)="onLogout()" class="btn-logout">ออกจากระบบ</button>
            </ng-container>
        </div>
    </div>
</nav>
